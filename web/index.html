<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FractalHive</title>
<style>
  body { margin: 0; background: #0b0b0f; color: #cfcfe0; font-family: ui-monospace, monospace; }
  #wrap { position: relative; width: 800px; margin: 16px auto; }
  #c { display: block; cursor: grab; background: #000; border: 1px solid #222; }
  #c:active { cursor: grabbing; }
  #hud { position: absolute; top: 8px; left: 8px; padding: 6px 8px;
         background: rgba(0,0,0,.55); font-size: 12px; line-height: 1.4; white-space: pre; }
  #help { width: 800px; margin: 0 auto; font-size: 12px; color: #7a7a90; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="800" height="600"></canvas>
    <div id="hud"></div>
  </div>
  <p id="help">drag to pan &middot; scroll to zoom &middot; <b>[</b> / <b>]</b> fewer/more workers &middot; tiles arrive highest-bid first, rendered in parallel</p>
<script>
const W = 800, H = 600, TILE = 64;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');

let view = { cx: -0.5, cy: 0.0, scale: 0.005 };
let workers = 4;
let inFlight = null; // AbortController for the current render

function qs(extra) {
  const p = { cx: view.cx, cy: view.cy, scale: view.scale, w: W, h: H, ...extra };
  return Object.entries(p).map(([k, v]) => k + '=' + v).join('&');
}

function setHud(tiles, ms) {
  hud.textContent =
    `center (${view.cx.toFixed(6)}, ${view.cy.toFixed(6)})\n` +
    `scale  ${view.scale.toExponential(2)} /px\n` +
    `workers ${workers}   tiles ${tiles}\n` +
    `render  ${ms == null ? '…' : ms.toFixed(0) + ' ms'}`;
}

// Ask the server to render the whole viewport in parallel; it streams framed
// tiles (16-byte header of x0,y0,x1,y1 as little-endian int32, then RGBA) which
// we paint as they arrive. A new render aborts the old one -> the socket closes
// -> the server's workers stop (cooperative cancellation).
async function render() {
  if (inFlight) inFlight.abort();
  inFlight = new AbortController();
  const t0 = performance.now();
  let res;
  try {
    res = await fetch('/render?' + qs({ tile: TILE, workers }), { signal: inFlight.signal });
  } catch { return; }
  const reader = res.body.getReader();
  let buf = new Uint8Array(0), tiles = 0;
  setHud(0, null);
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      const next = new Uint8Array(buf.length + value.length);
      next.set(buf); next.set(value, buf.length); buf = next;
      while (buf.length >= 16) {
        const dv = new DataView(buf.buffer, buf.byteOffset, 16);
        const x0 = dv.getInt32(0, true), y0 = dv.getInt32(4, true);
        const x1 = dv.getInt32(8, true), y1 = dv.getInt32(12, true);
        const tw = x1 - x0, th = y1 - y0, need = 16 + tw * th * 4;
        if (buf.length < need) break;
        ctx.putImageData(new ImageData(new Uint8ClampedArray(buf.subarray(16, need)), tw, th), x0, y0);
        buf = buf.subarray(need);
        setHud(++tiles, performance.now() - t0);
      }
    }
  } catch { return; }
  setHud(tiles, performance.now() - t0);
}

// [ / ] change the worker count live, so you can watch render time move.
window.addEventListener('keydown', e => {
  if (e.key === '[') { workers = Math.max(1, workers - 1); render(); }
  else if (e.key === ']') { workers = Math.min(16, workers + 1); render(); }
});

// Pan: track the drag in screen pixels, shift the center on release.
let drag = null;
canvas.addEventListener('mousedown', e => { drag = { x: e.clientX, y: e.clientY }; });
window.addEventListener('mouseup', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag = null;
  if (dx === 0 && dy === 0) return;
  view.cx -= dx * view.scale;
  view.cy += dy * view.scale;
  render();
});

// Zoom about the cursor: keep the complex point under the mouse fixed.
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 0.8 : 1.25;
  const mx = e.offsetX, my = e.offsetY;
  const re = view.cx + (mx - W / 2) * view.scale;
  const im = view.cy - (my - H / 2) * view.scale;
  view.scale *= factor;
  view.cx = re - (mx - W / 2) * view.scale;
  view.cy = im + (my - H / 2) * view.scale;
  render();
}, { passive: false });

render();
</script>
</body>
</html>
