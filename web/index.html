<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FractalHive</title>
<style>
  body { margin: 0; background: #0b0b0f; color: #cfcfe0; font-family: ui-monospace, monospace; }
  #wrap { position: relative; width: 800px; margin: 16px auto; }
  #c { display: block; cursor: grab; background: #000; border: 1px solid #222; }
  #c:active { cursor: grabbing; }
  #hud { position: absolute; top: 8px; left: 8px; padding: 6px 8px;
         background: rgba(0,0,0,.55); font-size: 12px; line-height: 1.4; white-space: pre; }
  #help { width: 800px; margin: 0 auto; font-size: 12px; color: #7a7a90; }
  #panel { width: 800px; margin: 8px auto; display: flex; align-items: center; gap: 12px;
           font-size: 12px; color: #b9b9cc; }
  #panel input[type=range] { width: 160px; }
  #status { min-width: 190px; white-space: pre; }
  #spinner { display: inline-block; width: 1ch; color: #7fb0e0; }
  #barwrap { flex: 1; height: 6px; background: #1a1a22; border-radius: 3px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: #3b6ea5; transition: width .08s linear; }
  #bar.done { background: #4a9a5a; }
  #zoombtns button { width: 26px; height: 24px; margin-right: 2px; cursor: pointer;
                     background: #1a1a22; color: #cfcfe0; border: 1px solid #333;
                     border-radius: 4px; font-size: 14px; line-height: 1; }
  #zoombtns button:hover { background: #262631; }
  #panel select, #panel button { background: #1a1a22; color: #cfcfe0; border: 1px solid #333;
                                 border-radius: 4px; padding: 2px 6px; cursor: pointer; }
  #graph { width: 800px; margin: 8px auto; font-size: 12px; color: #b9b9cc; }
  #graph .grow { display: flex; align-items: flex-end; gap: 3px; height: 60px; margin: 2px 0 0; }
  #graph .gbar { width: 16px; background: #4a9a5a; min-height: 1px; }
  #graph .grow.silo .gbar { background: #a5533b; }
  #graph .glabel { color: #9a9ab0; margin-top: 6px; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="800" height="600"></canvas>
    <div id="hud"></div>
  </div>
  <div id="panel">
    <label>workers <b id="wval">4</b></label>
    <input id="wslider" type="range" min="1" max="16" value="4">
    <span id="zoombtns">
      <button id="zout" title="zoom out">&minus;</button>
      <button id="zin" title="zoom in">+</button>
      <button id="zreset" title="reset view">&#8962;</button>
    </span>
    <label>markets
      <select id="mkt"><option>1</option><option>2</option><option selected>4</option><option>8</option></select>
    </label>
    <label><input type="checkbox" id="arb" checked> arb</label>
    <label>part
      <select id="part"><option value="band" selected>band</option><option value="strided">strided</option></select>
    </label>
    <button id="bench">benchmark</button>
    <div id="status"><span id="spinner"></span> <span id="stext">idle</span></div>
    <div id="barwrap"><div id="bar"></div></div>
  </div>
  <div id="graph"></div>
  <p id="help">drag to pan &middot; scroll or <b>&minus;</b>/<b>+</b> to zoom &middot; <b>&#8962;</b> reset &middot; <b>[</b>/<b>]</b> or slider = workers &middot; iterations auto-scale with zoom &middot; pick markets + arbitrage, then <b>benchmark</b></p>
<script>
const W = 800, H = 600, TILE = 64;
const TOTAL = Math.ceil(W / TILE) * Math.ceil(H / TILE);
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const bar = document.getElementById('bar');
const spinner = document.getElementById('spinner');
const stext = document.getElementById('stext');
const wslider = document.getElementById('wslider');
const wval = document.getElementById('wval');
const mktSel = document.getElementById('mkt');
const arbBox = document.getElementById('arb');
const partSel = document.getElementById('part');
const graph = document.getElementById('graph');

let view = { cx: -0.5, cy: 0.0, scale: 0.005 };
let workers = 4;
let markets = 4;
let arb = true;
let part = 'band';
let curIters = 200;
let inFlight = null; // AbortController for the current render

// max_iter must climb as we zoom in or deep boundary filaments go blobby. Each
// render is still finite -- this only sets how hard we look at each pixel.
function autoIters() {
  const z = Math.log2(0.005 / view.scale);
  return Math.min(4000, Math.max(200, Math.round(200 + 40 * Math.max(0, z))));
}

function qs(extra) {
  const p = { cx: view.cx, cy: view.cy, scale: view.scale, w: W, h: H, ...extra };
  return Object.entries(p).map(([k, v]) => k + '=' + v).join('&');
}

function setHud(tiles, ms) {
  hud.textContent =
    `center (${view.cx.toFixed(6)}, ${view.cy.toFixed(6)})\n` +
    `scale  ${view.scale.toExponential(2)} /px\n` +
    `workers ${workers}   iters ${curIters}\n` +
    `tiles ${tiles}/${TOTAL}   render ${ms == null ? '…' : ms.toFixed(0) + ' ms'}`;
}

let spinTimer = null, spinFrame = 0;
const SPIN = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
function startLoad() {
  bar.classList.remove('done');
  bar.style.width = '0%';
  stext.textContent = 'rendering';
  if (!spinTimer) spinTimer = setInterval(() => {
    spinner.textContent = SPIN[spinFrame = (spinFrame + 1) % SPIN.length];
  }, 80);
}
function stopLoad(msg) {
  clearInterval(spinTimer); spinTimer = null;
  spinner.textContent = '';
  stext.textContent = msg;
}

// Ask the server to render the whole viewport in parallel; it streams framed
// tiles (16-byte header of x0,y0,x1,y1 as little-endian int32, then RGBA) which
// we paint as they arrive. A new render aborts the old one -> the socket closes
// -> the server's workers stop (cooperative cancellation).
async function render() {
  if (inFlight) inFlight.abort();
  inFlight = new AbortController();
  const me = inFlight;
  curIters = autoIters();
  startLoad();
  const t0 = performance.now();
  let res;
  try {
    res = await fetch('/render?' + qs({ tile: TILE, workers, iters: curIters, markets, arb: arb ? 1 : 0, tint: 1, part }), { signal: me.signal });
  } catch { return; }
  const reader = res.body.getReader();
  let buf = new Uint8Array(0), tiles = 0;
  setHud(0, null);
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      if (inFlight !== me) return; // superseded by a newer render
      const next = new Uint8Array(buf.length + value.length);
      next.set(buf); next.set(value, buf.length); buf = next;
      while (buf.length >= 16) {
        const dv = new DataView(buf.buffer, buf.byteOffset, 16);
        const x0 = dv.getInt32(0, true), y0 = dv.getInt32(4, true);
        const x1 = dv.getInt32(8, true), y1 = dv.getInt32(12, true);
        const tw = x1 - x0, th = y1 - y0, need = 16 + tw * th * 4;
        if (buf.length < need) break;
        ctx.putImageData(new ImageData(new Uint8ClampedArray(buf.subarray(16, need)), tw, th), x0, y0);
        buf = buf.subarray(need);
        tiles++;
        bar.style.width = (tiles / TOTAL * 100) + '%';
        setHud(tiles, performance.now() - t0);
      }
    }
  } catch { return; }
  if (inFlight !== me) return;
  const ms = performance.now() - t0;
  bar.style.width = '100%';
  bar.classList.add('done');
  stopLoad(`✓ ${tiles} tiles · ${ms.toFixed(0)} ms`);
  setHud(tiles, ms);
}

function setWorkers(n) {
  workers = Math.max(1, Math.min(16, n));
  wslider.value = workers;
  wval.textContent = workers;
}

wslider.addEventListener('input', () => { setWorkers(+wslider.value); render(); });
mktSel.addEventListener('change', () => { markets = +mktSel.value; render(); });
arbBox.addEventListener('change', () => { arb = arbBox.checked; render(); });
partSel.addEventListener('change', () => { part = partSel.value; render(); });

// Benchmark: /stats runs both partitions x both modes and returns per-worker
// utilization. We draw two groups (band, strided) each with a siloed and an
// arbitrage bar row, so the contrast is visible: band's siloed row has idle
// workers that arbitrage rescues, while a fair strided partition is already
// near-full even without stealing.
const bench = document.getElementById('bench');
const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
function barRow(m, cls) {
  const bars = m.util.map(u =>
    `<div class="gbar" style="height:${Math.round(u * 100)}%" title="${(u * 100).toFixed(0)}%"></div>`).join('');
  return `<div class="grow ${cls}">${bars}</div>`;
}
function groupHtml(name, g) {
  const speed = g.siloed.wallMs / g.arbitrage.wallMs;
  return `<div style="margin-top:8px"><b>${name}</b> · arbitrage ${speed.toFixed(2)}× faster · ` +
    `util ${(mean(g.siloed.util) * 100).toFixed(0)}% → ${(mean(g.arbitrage.util) * 100).toFixed(0)}%</div>` +
    `<div class="glabel">siloed · ${g.siloed.wallMs.toFixed(0)} ms</div>` + barRow(g.siloed, 'silo') +
    `<div class="glabel">arbitrage · ${g.arbitrage.wallMs.toFixed(0)} ms</div>` + barRow(g.arbitrage, 'arb');
}
function drawGraph(d) {
  graph.innerHTML = `<div>markets ${d.markets} · workers ${d.workers}</div>` +
    groupHtml('band (contiguous)', d.band) + groupHtml('strided (interleaved)', d.strided);
}
bench.addEventListener('click', async () => {
  graph.textContent = 'benchmarking…';
  try {
    const d = await (await fetch('/stats?' + qs({ tile: TILE, workers, markets, iters: curIters }))).json();
    drawGraph(d);
  } catch { graph.textContent = 'benchmark failed'; }
});

// [ / ] change workers; + / - / 0 zoom in / out / reset from the keyboard.
window.addEventListener('keydown', e => {
  if (e.key === '[') { setWorkers(workers - 1); render(); }
  else if (e.key === ']') { setWorkers(workers + 1); render(); }
  else if (e.key === '=' || e.key === '+') zoomAt(W / 2, H / 2, 0.7);
  else if (e.key === '-' || e.key === '_') zoomAt(W / 2, H / 2, 1 / 0.7);
  else if (e.key === '0') resetView();
});

// Pan: track the drag in screen pixels, shift the center on release.
let drag = null;
canvas.addEventListener('mousedown', e => { drag = { x: e.clientX, y: e.clientY }; });
window.addEventListener('mouseup', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag = null;
  if (dx === 0 && dy === 0) return;
  view.cx -= dx * view.scale;
  view.cy += dy * view.scale;
  render();
});

// Zoom keeping the complex point under (mx,my) fixed. The wheel passes the
// cursor; the buttons pass the canvas center.
function zoomAt(mx, my, factor) {
  const re = view.cx + (mx - W / 2) * view.scale;
  const im = view.cy - (my - H / 2) * view.scale;
  view.scale *= factor;
  view.cx = re - (mx - W / 2) * view.scale;
  view.cy = im + (my - H / 2) * view.scale;
  render();
}

// Proportional to deltaY so a small trackpad scroll is a small zoom (no jumps).
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(e.offsetX, e.offsetY, Math.pow(1.0015, e.deltaY));
}, { passive: false });

function resetView() { view = { cx: -0.5, cy: 0.0, scale: 0.005 }; render(); }
document.getElementById('zin').addEventListener('click', () => zoomAt(W / 2, H / 2, 0.7));
document.getElementById('zout').addEventListener('click', () => zoomAt(W / 2, H / 2, 1 / 0.7));
document.getElementById('zreset').addEventListener('click', resetView);

render();
</script>
</body>
</html>
